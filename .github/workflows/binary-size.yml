name: Binary size

# G6. Profile and dependency changes are global -- they land on all four
# targets release.yml ships -- but the only local measurement anyone can take is
# Windows, and scripts/bench.ps1 is Windows-and-Rokit-bound on top of that. So a
# change that shrinks Windows and bloats macOS-aarch64 would otherwise pass every
# gate and reach users through `lpm self update`.
#
# Runs on demand, and automatically on any PR that touches what decides code
# size: the manifest, the lockfile, or cargo config.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  size:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        # Deliberately the same four rows as release.yml. If that matrix gains a
        # target, this one has to gain it too, or the new platform ships
        # unmeasured.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: lpm-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: lpm-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: lpm-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: lpm-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Measure
        shell: bash
        run: |
          if [[ "${{ matrix.asset }}" == *.exe ]]; then
            binary="target/${{ matrix.target }}/release/lpm.exe"
          else
            binary="target/${{ matrix.target }}/release/lpm"
          fi
          # bytes, not a human-readable rounding: the whole point is comparing
          # two numbers that may differ by well under a megabyte
          bytes=$(wc -c < "$binary" | tr -d ' ')
          echo "${{ matrix.asset }}: $bytes bytes"
          printf '| `%s` | %s |\n' "${{ matrix.asset }}" "$bytes" >> "$GITHUB_STEP_SUMMARY"
