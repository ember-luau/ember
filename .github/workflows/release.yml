name: Release

on:
  push:
    tags: ["v*"]
  # A dry run builds and stages every asset and stops there. It makes no
  # release, publishes nothing to crates.io and pushes nothing to the AUR,
  # so the matrix is provable before a tag starts the one-way half. The
  # channel jobs (Homebrew, Scoop, winget) write and test their files for
  # the latest release and push nothing. The Nix job builds the flake.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # `embr self update` compares the release tag against the version compiled into
  # the binary, so a tag that doesn't match Cargo.toml would make every install
  # report an update forever. Refuse to release on mismatch.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          # a dry run has no tag to compare
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "dry run at Cargo.toml version $crate_version"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

  # Publishing is irreversible: a crates.io version can be yanked but never
  # replaced or re-uploaded. So it waits for the binaries, which is where a
  # broken build actually shows up, and it runs once rather than per platform.
  # Needs the CRATES_SECRET repo secret, a crates.io token with publish-update
  # scope on embr. cargo only reads it as CARGO_REGISTRY_TOKEN, hence the
  # rename on the way in.
  publish-crate:
    name: Publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Verification is left on deliberately. It builds the packaged crate,
      # which is the only thing that catches an `exclude` in Cargo.toml having
      # dropped a file the build needs, and the job above never sees that.
      #
      # Re-running a release whose upload already landed should be a no-op,
      # not a red job. Any other failure still fails the workflow.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_SECRET }}
        run: |
          # without pipefail the `if` would read tee's status, not cargo's,
          # and every failed publish would look like a success
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          # outside the checkout: cargo publish refuses to run at all with an
          # uncommitted file in the working tree, and the log is one
          log="$RUNNER_TEMP/publish.log"
          if cargo publish --locked 2>&1 | tee "$log"; then
            echo "Published embr $version"
            exit 0
          fi
          if grep -qE "already (uploaded|exists)" "$log"; then
            echo "embr $version is already on crates.io, nothing to do"
            exit 0
          fi
          exit 1

  build:
    name: Build (${{ matrix.asset }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        # Asset names must stay in the form embr-{os}-{arch}[.exe] that
        # `embr self update` derives from std::env::consts. The zip staged
        # below is named from the same base -- see the Stage assets step.
        #
        # The Linux target builds with cargo-zigbuild against glibc 2.17
        # (`zig`). A plain build on the runner links its own glibc, 2.39 on
        # ubuntu-24.04, and the binary then fails to start on Debian 12
        # (2.36), Ubuntu 22.04 (2.35), and older. Zig also compiles the C
        # and assembly of `ring`, the crypto under rustls.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: embr-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: x86_64-unknown-linux-gnu.2.17
            asset: embr-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: embr-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: embr-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          # A venv, since the runner's Python refuses a global pip install.
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.0 ziglang==0.17.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build (zig, old glibc)
        if: matrix.zig
        # The output still goes to target/<target>/release: zigbuild drops
        # the glibc version from the folder name.
        run: cargo zigbuild --release --locked --target ${{ matrix.zig }}
      - name: Check the glibc the binary needs
        if: matrix.zig
        run: |
          path="target/${{ matrix.target }}/release/embr"
          need=$(objdump -T "$path" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "embr needs $need"
          # Above 2.17 means the build linked the runner's glibc.
          if [ "$(printf '%s\nGLIBC_2.17\n' "$need" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
            echo "::error::embr needs $need, newer than GLIBC_2.17"
            exit 1
          fi
          "$path" --version
      # Two assets per platform, on purpose:
      #
      #   embr-{os}-{arch}.zip   holding a bare embr[.exe]. What `embr self
      #                         update` reads, and the only shape rokit and
      #                         mise will install embr from -- they take
      #                         archives, not loose binaries.
      #   embr-{os}-{arch}[.exe] the bare binary. Kept ONLY so an embr from
      #                         before the zip existed, which matches this
      #                         name exactly and cannot be taught otherwise,
      #                         can still update into a release that has one.
      #                         Droppable once nobody is left on such a
      #                         version; nothing current reads it.
      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          if [[ "$asset" == *.exe ]]; then binary="embr.exe"; else binary="embr"; fi
          mkdir -p dist pack
          cp "target/${{ matrix.target }}/release/$binary" "dist/$asset"
          cp "target/${{ matrix.target }}/release/$binary" "pack/$binary"
          # the archive must hold the binary at its root under its plain
          # name, which is what `embr self update` looks for inside it.
          # Compress-Archive on Windows and zip elsewhere: both ship with
          # the runner images, and zip preserves the executable bit that
          # rokit and mise need on unix.
          if [[ "$asset" == *.exe ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'pack/$binary' -DestinationPath 'dist/${asset%.exe}.zip' -Force"
          else
            chmod +x "pack/$binary"
            (cd pack && zip -q "../dist/$asset.zip" "$binary")
          fi
          ls -l dist
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # No generated notes: this step runs once per matrix platform, and
          # each run would append another "What's Changed" section to the same
          # release. Notes are written by hand -- announce.yml waits for them
          # and posts them to Discord once they land.
          # Semver pre-release tags (v0.1.0-alpha.1, v1.0.0-rc.2, ...) get GitHub's
          # pre-release badge and are skipped by the releases/latest API that
          # `embr self update` polls.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Each build job uploads its own assets, so the AUR job waits for all of
  # them. aur.yml skips a prerelease tag with a notice.
  aur:
    name: AUR
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  # One SHA256SUMS file for all release assets, in the format of sha256sum.
  # Each channel below reads its sums from it. A dry run has no release of
  # its own, so it sums the assets of the latest release and uploads
  # nothing to it.
  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sum.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Sum the release assets
        id: sum
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$(gh release view -R "$REPO" --json tagName -q .tagName)"
          else
            tag="$GITHUB_REF_NAME"
          fi
          mkdir assets
          cd assets
          # embr-* leaves out a SHA256SUMS of an earlier run of this job.
          gh release download "$tag" -R "$REPO" --pattern 'embr-*'
          sha256sum embr-* > SHA256SUMS
          cat SHA256SUMS
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Upload SHA256SUMS to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS -R "$REPO" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS

  # The channel jobs write their files with packaging/render.sh and test
  # them. They push only for a stable tag, and only when the token of the
  # channel is set. Without the token they stop with a notice, as the AUR
  # job does. After a failed push, run the failed job again.
  #
  # Homebrew: the formula goes to Formula/embr.rb in ember-luau/homebrew-tap,
  # so `brew install ember-luau/tap/embr` finds it. HOMEBREW_TAP_TOKEN is a
  # fine-grained token with Contents read and write on that repo only.
  homebrew:
    name: Homebrew
    needs: checksums
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.checksums.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
      - name: Write and test the formula
        run: |
          set -euo pipefail
          packaging/render.sh "$VERSION" SHA256SUMS out
          # The Linux runner image has Homebrew. A local tap holds the
          # formula for the audit, the install and the test.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git ember-luau/tap
          cp out/embr.rb "$(brew --repository ember-luau/tap)/Formula/embr.rb"
          brew audit --strict --online --formula ember-luau/tap/embr
          brew install --formula ember-luau/tap/embr
          brew test ember-luau/tap/embr
      - name: Push to the tap
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: packaging/push.sh ember-luau/homebrew-tap Formula/embr.rb out/embr.rb

  # Scoop: the manifest goes to bucket/embr.json in ember-luau/scoop-bucket.
  # SCOOP_BUCKET_TOKEN is a fine-grained token with Contents read and write
  # on that repo only. The job installs the manifest with Scoop first.
  scoop:
    name: Scoop
    needs: checksums
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.checksums.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
      - name: Write the manifest
        shell: bash
        run: packaging/render.sh "$VERSION" SHA256SUMS out
      - name: Install it with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\out\embr.json
          if ($LASTEXITCODE) { exit 1 }
          $out = embr --version
          $out
          if ($out -notmatch [regex]::Escape($env:VERSION)) { throw "expected $env:VERSION in the --version output" }
      - name: Push to the bucket
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: bash
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: packaging/push.sh ember-luau/scoop-bucket bucket/embr.json out/embr.json

  # winget: wingetcreate opens a pull request with the three manifests on
  # microsoft/winget-pkgs, from a fork in the account of WINGET_TOKEN. That
  # is a classic token with the public_repo scope. The first pull request
  # adds the package, the later ones add a version. A moderator merges each.
  winget:
    name: winget
    needs: checksums
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.checksums.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
      - name: Write the manifests
        shell: bash
        run: packaging/render.sh "$VERSION" SHA256SUMS out
      - name: Check the manifests
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest out\winget
            if ($LASTEXITCODE) { exit 1 }
          } else {
            "::notice::winget is not on this runner, so only wingetcreate checks the manifests, when it submits them."
          }
      - name: Submit to winget-pkgs
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_TOKEN) {
            "::notice::WINGET_TOKEN is not set, so the winget manifests for $env:VERSION were written but not submitted."
            exit 0
          }
          # Pinned to one release, and checked against its published SHA-256.
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe'
          Invoke-WebRequest $url -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') {
            throw "wingetcreate.exe has the SHA-256 $hash, not the pinned one"
          }
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: ember-luau.embr version $env:VERSION" out\winget
          if ($LASTEXITCODE) { exit 1 }

  # The flake builds embr from the tagged source. This job only checks that
  # it still builds, so a broken flake shows on the release. Nothing waits
  # for it: crates.io and the channels publish without it.
  nix:
    name: Nix (${{ matrix.os }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check the flake
        run: nix flake check --print-build-logs
      - name: Build and run embr
        run: |
          nix build --print-build-logs
          ./result/bin/embr --version
