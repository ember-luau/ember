name: Release

on:
  push:
    tags: ["v*"]
  # A dry run builds and stages every asset and stops there. It makes no
  # release, publishes nothing to crates.io and pushes nothing to the AUR,
  # so the matrix is provable before a tag starts the one-way half.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # `embr self update` compares the release tag against the version compiled into
  # the binary, so a tag that doesn't match Cargo.toml would make every install
  # report an update forever. Refuse to release on mismatch.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          # a dry run has no tag to compare
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "dry run at Cargo.toml version $crate_version"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

  # Publishing is irreversible: a crates.io version can be yanked but never
  # replaced or re-uploaded. So it waits for the binaries, which is where a
  # broken build actually shows up, and it runs once rather than per platform.
  # Needs the CRATES_SECRET repo secret, a crates.io token with publish-update
  # scope on embr. cargo only reads it as CARGO_REGISTRY_TOKEN, hence the
  # rename on the way in.
  publish-crate:
    name: Publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Verification is left on deliberately. It builds the packaged crate,
      # which is the only thing that catches an `exclude` in Cargo.toml having
      # dropped a file the build needs, and the job above never sees that.
      #
      # Re-running a release whose upload already landed should be a no-op,
      # not a red job. Any other failure still fails the workflow.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_SECRET }}
        run: |
          # without pipefail the `if` would read tee's status, not cargo's,
          # and every failed publish would look like a success
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          # outside the checkout: cargo publish refuses to run at all with an
          # uncommitted file in the working tree, and the log is one
          log="$RUNNER_TEMP/publish.log"
          if cargo publish --locked 2>&1 | tee "$log"; then
            echo "Published embr $version"
            exit 0
          fi
          if grep -qE "already (uploaded|exists)" "$log"; then
            echo "embr $version is already on crates.io, nothing to do"
            exit 0
          fi
          exit 1

  build:
    name: Build (${{ matrix.asset }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        # Asset names must stay in the form embr-{os}-{arch}[.exe] that
        # `embr self update` derives from std::env::consts. The zip staged
        # below is named from the same base -- see the Stage assets step.
        #
        # The Linux target builds with cargo-zigbuild against glibc 2.17
        # (`zig`). A plain build on the runner links its own glibc, 2.39 on
        # ubuntu-24.04, and the binary then fails to start on Debian 12
        # (2.36), Ubuntu 22.04 (2.35), and older. Zig also compiles the C
        # and assembly of `ring`, the crypto under rustls.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: embr-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: x86_64-unknown-linux-gnu.2.17
            asset: embr-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: embr-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: embr-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          # A venv, since the runner's Python refuses a global pip install.
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.0 ziglang==0.17.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build (zig, old glibc)
        if: matrix.zig
        # The output still goes to target/<target>/release: zigbuild drops
        # the glibc version from the folder name.
        run: cargo zigbuild --release --locked --target ${{ matrix.zig }}
      - name: Check the glibc the binary needs
        if: matrix.zig
        run: |
          path="target/${{ matrix.target }}/release/embr"
          need=$(objdump -T "$path" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "embr needs $need"
          # Above 2.17 means the build linked the runner's glibc.
          if [ "$(printf '%s\nGLIBC_2.17\n' "$need" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
            echo "::error::embr needs $need, newer than GLIBC_2.17"
            exit 1
          fi
          "$path" --version
      # Two assets per platform, on purpose:
      #
      #   embr-{os}-{arch}.zip   holding a bare embr[.exe]. What `embr self
      #                         update` reads, and the only shape rokit and
      #                         mise will install embr from -- they take
      #                         archives, not loose binaries.
      #   embr-{os}-{arch}[.exe] the bare binary. Kept ONLY so an embr from
      #                         before the zip existed, which matches this
      #                         name exactly and cannot be taught otherwise,
      #                         can still update into a release that has one.
      #                         Droppable once nobody is left on such a
      #                         version; nothing current reads it.
      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          if [[ "$asset" == *.exe ]]; then binary="embr.exe"; else binary="embr"; fi
          mkdir -p dist pack
          cp "target/${{ matrix.target }}/release/$binary" "dist/$asset"
          cp "target/${{ matrix.target }}/release/$binary" "pack/$binary"
          # the archive must hold the binary at its root under its plain
          # name, which is what `embr self update` looks for inside it.
          # Compress-Archive on Windows and zip elsewhere: both ship with
          # the runner images, and zip preserves the executable bit that
          # rokit and mise need on unix.
          if [[ "$asset" == *.exe ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'pack/$binary' -DestinationPath 'dist/${asset%.exe}.zip' -Force"
          else
            chmod +x "pack/$binary"
            (cd pack && zip -q "../dist/$asset.zip" "$binary")
          fi
          ls -l dist
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # No generated notes: this step runs once per matrix platform, and
          # each run would append another "What's Changed" section to the same
          # release. Notes are written by hand -- announce.yml waits for them
          # and posts them to Discord once they land.
          # Semver pre-release tags (v0.1.0-alpha.1, v1.0.0-rc.2, ...) get GitHub's
          # pre-release badge and are skipped by the releases/latest API that
          # `embr self update` polls.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Each build job uploads its own assets, so the AUR job waits for all of
  # them. aur.yml skips a prerelease tag with a notice.
  aur:
    name: AUR
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
