name: CI

on:
  push:
    branches: [master]
  pull_request:

# the jobs build and test, and write nothing back
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  # The Luau parser's stack budget is spent on frames whose size is a codegen
  # decision, so the tests that sit at MAX_NESTING_DEPTH only mean something in
  # the profile users actually run. They are `cfg(not(debug_assertions))` and
  # therefore invisible to the dev-profile job above -- an unoptimized build
  # needs ~48 MiB of the parse thread's 64 to reach that depth, close enough to
  # the edge that running them there just produces aborted test binaries on
  # whichever runner has slightly fatter frames.
  #
  # One OS: this pays fat-LTO link time, and binary-size.yml covers all four
  # targets whenever the profile or the lockfile changes.
  test-release:
    name: Test (release profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo test --release --locked

  # The setup action as a project uses it, on each system it has a build
  # for: the download, the hash check and PATH.
  setup-action:
    name: Setup action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./setup
        with:
          install: "false"
      - name: embr is on PATH
        shell: bash
        run: embr --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
