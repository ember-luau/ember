name: Announce

# Posts a release's notes to Discord and keeps that one message in sync.
#
# Notes are written by hand, and the tag push creates the release with an
# empty body (see release.yml), so this can't just fire once on publish and
# be done. Instead: nothing is posted while the body is empty, the first
# edit that carries notes posts the embed, and every later edit patches that
# same message. The message id is remembered in the Actions cache, keyed by
# release id. If that cache is evicted -- 7 days without a hit -- an edit
# after the fact posts a second message rather than updating the first.
on:
  release:
    types: [published, edited]

permissions:
  contents: read

# `edited` fires on every touch of the release, including release.yml's four
# matrix jobs updating it as they upload assets. Runs are serialized so two
# of them can't both miss the cached message id and announce twice; queued,
# not cancelled, so a late edit never drops the sync it was queued for.
concurrency:
  group: discord-announce-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  discord:
    name: Post release notes to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Build the embed
        id: embed
        env:
          # A fork's PRs never see this, and neither does a repo that hasn't
          # set it; both cases skip below instead of failing the release.
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK is not set; nothing to announce."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read the release from the event payload with jq rather than
          # `${{ github.event.release.body }}`: interpolating release text
          # into a shell script would run a $(...) or backtick in the notes.
          if [ -z "$(jq -r '.release.body // "" | gsub("\\s"; "")' "$GITHUB_EVENT_PATH")" ]; then
            echo "::notice::Release body is empty (assets still uploading, or the notes aren't written yet); waiting for an edit that has them."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Discord caps a description at 4096 characters and the whole embed
          # at 6000; long notes get cut with a link to the rest.
          jq '
            .release as $release
            | ($release.body | gsub("\r\n"; "\n")) as $body
            | (if ($body | length) > 3900
                 then $body[0:3900] + "…\n\n[Read the full notes](" + $release.html_url + ")"
                 else $body
               end) as $description
            | {
                username: "lpm",
                avatar_url: "https://luaupm.com/lpm-logo.png",
                embeds: [{
                  title: (if ($release.name // "") == "" then $release.tag_name else $release.name end),
                  url: $release.html_url,
                  description: $description,
                  color: 15077448,
                  timestamp: ($release.published_at // $release.created_at),
                  thumbnail: { url: "https://luaupm.com/lpm-logo.png" },
                  footer: {
                    text: (if $release.prerelease
                             then "Pre-release · lpm self update stays on the latest stable"
                             else "Update with: lpm self update"
                           end)
                  }
                }]
              }
          ' "$GITHUB_EVENT_PATH" > payload.json

      - name: Look for a message already posted for this release
        if: steps.embed.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: message-id
          key: discord-message-${{ github.event.release.id }}

      - name: Send it
        id: send
        if: steps.embed.outputs.skip != 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail

          # `?wait=true` makes Discord answer with the message it created,
          # which is the only way to learn the id we edit later.
          post() {
            curl -sS -o response.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data-binary @payload.json "$WEBHOOK?wait=true"
          }
          patch() {
            curl -sS -o response.json -w '%{http_code}' \
              -X PATCH -H 'Content-Type: application/json' \
              --data-binary @payload.json "$WEBHOOK/messages/$1"
          }

          if [ -s message-id ]; then
            id="$(cat message-id)"
            code="$(patch "$id")"
            case "$code" in
              2??)
                echo "Updated Discord message $id with the current notes."
                exit 0
                ;;
              404)
                # Someone deleted it in Discord; fall through and post again.
                echo "::notice::Message $id is gone from Discord; posting a new one."
                ;;
              *)
                echo "::error::Discord rejected the edit (HTTP $code): $(cat response.json)"
                exit 1
                ;;
            esac
          fi

          code="$(post)"
          case "$code" in
            2??) ;;
            *)
              echo "::error::Discord rejected the post (HTTP $code): $(cat response.json)"
              exit 1
              ;;
          esac
          jq -r '.id' response.json > message-id
          echo "Posted Discord message $(cat message-id)."
          echo "posted=true" >> "$GITHUB_OUTPUT"

      # Only after a fresh post: cache keys are immutable, so re-saving one
      # that already exists is a warning and a wasted upload.
      - name: Remember the message
        if: steps.send.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: message-id
          key: discord-message-${{ github.event.release.id }}
