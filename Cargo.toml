[package]
# `lpm` is taken on crates.io (by a LaTeX package manager), so the crate ships
# as luaupm while the binary stays `lpm`: cargo install luaupm, then run lpm.
name = "luaupm"
version = "0.3.0"
edition = "2024"
# let-chains, used throughout, are stable from here.
rust-version = "1.88"
description = "The Luau package manager: dependencies, tools and scripts for Luau and Roblox projects"
authors = ["savruun"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/luaupm/cli"
homepage = "https://github.com/luaupm"
documentation = "https://github.com/luaupm/cli#readme"
keywords = ["luau", "roblox", "package-manager", "wally", "pesde"]
categories = ["command-line-utilities", "development-tools"]
# Repo furniture that does not belong in the published crate. src/, the
# lockfile, the readme and the license ship; target/ and gitignored files are
# dropped by cargo already.
exclude = [".github/", "scripts/", "CLAUDE.md"]

[[bin]]
name = "lpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.25"
dirs = "6.0.0"
inquire = "0.7"
self-replace = "1.5.0"
semver = "1.0.28"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
indicatif = "0.18.6"
full_moon = { version = "2.2.0", features = ["luau"] }
globset = "0.4.19"
jsonc-parser = { version = "0.33.1", features = ["cst"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

# Release builds are what users download or `cargo install`, so trade compile
# time for a smaller, faster binary. Measured on x86_64-pc-windows-msvc with
# rustc 1.96.1, each step against the one above it:
#
#   lto = "thin", opt-level = 3    7,561,728 bytes
#   lto = "fat"                    7,201,792   -4.8%
#   + opt-level = "s"              5,486,592  -27.4% total
#
# opt-level = "s" costs nothing measurable here. Over 15 runs of
# scripts/bench.ps1 the startup, no-op, and locked-install medians all landed at
# or below the opt-level = 3 numbers: lpm's install path waits on syscalls, the
# network, and archive extraction, not on vectorized loops. Both gates that
# would catch a semantic change (scripts/golden-cli.ps1, scripts/install-fixture.ps1)
# are byte-identical across the change, and the parser stack-margin test passes
# under --release, which is the one place where inlining and correctness meet
# (see MAX_NESTING_DEPTH in src/project/package.rs).
#
# Not added deliberately: /OPT:REF,ICF, which rustc already passes for MSVC
# release links -- an explicit -C link-arg=/OPT:REF,ICF produces a byte-identical
# binary. strip is worth only ~2 KiB here, since MSVC debug info lives in a
# separate .pdb, but it is real on the Linux and macOS targets, so it stays.
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true

