# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

# The release zip holds embr.exe at its root. winget installs it as a
# portable package and puts the alias embr on PATH. The binary links the
# MSVC runtime (VCRUNTIME140.dll), so the VC++ redistributable comes first.
PackageIdentifier: ember-luau.embr
PackageVersion: "@VERSION@"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: embr.exe
  PortableCommandAlias: embr
Commands:
- embr
ReleaseDate: "@RELEASE_DATE@"
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/ember-luau/ember/releases/download/v@VERSION@/embr-windows-x86_64.zip
  InstallerSha256: "@SHA256_WINDOWS_X86_64@"
  Dependencies:
    PackageDependencies:
    - PackageIdentifier: Microsoft.VCRedist.2015+.x64
ManifestType: installer
ManifestVersion: 1.10.0
